<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>자동사 디파처보드</title>
<meta name="description" content="영어MCP 제1강 스크립트를 TTS 음성과 싱크된 공항 발착 안내판 플레이어로 재생합니다.">
<style>
  :root{
    --bg:#0b0d10;
    --board:#15181d;
    --bezel:#050607;
    --rivet:#2a2f37;
    --flap:#1b1f26;
    --flap-seam:#000000;
    --ink:#f4efe0;
    --ink-dim:#7b828c;
    --sub-ink:#c9d0d8;
    --accent:#ff8a3d;
    --accent-dim:#8a4a22;
    --track:#22262c;
    --btn:#1c2027;
    --btn-ink:#e7e2d3;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #1a1f26 0%, var(--bg) 55%) fixed,
      var(--bg);
    color:var(--sub-ink);
    font-family:'Noto Sans KR','Space Mono',monospace;
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    padding-inline:16px;
    padding-block:28px 32px;
  }
  .wrap{
    width:100%;
    max-width:860px;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    border-bottom:1px solid #23272f;
    padding-bottom:14px;
  }
  .masthead .id{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .masthead h1{
    margin:4px 0 0;
    font-family:'Noto Sans KR',sans-serif;
    font-weight:700;
    font-size:clamp(18px,3.6vw,26px);
    color:var(--ink);
    text-wrap:balance;
  }
  .masthead .clock{
    font-family:'Space Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:12px;
    color:var(--ink-dim);
    text-align:right;
    line-height:1.5;
  }
  .clock b{color:var(--sub-ink);font-weight:700;}

  .board-scale-wrap{ width:100%; overflow:hidden; }
  .board{
    position:relative;
    display:inline-block;
    width:max-content;
    background:linear-gradient(180deg,var(--board),#101317 85%);
    border:1px solid var(--bezel);
    border-radius:14px;
    padding:26px 18px 18px;
    box-shadow:
      0 0 0 1px #000 inset,
      0 30px 60px -25px rgba(0,0,0,.7),
      0 2px 0 #2a2f37 inset;
    transform-origin:top left;
  }
  .rivet{
    position:absolute;
    width:8px;height:8px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#4a505a,var(--rivet) 60%,#050607);
  }
  .rivet.tl{top:10px;left:10px;}
  .rivet.tr{top:10px;right:10px;}
  .rivet.bl{bottom:10px;left:10px;}
  .rivet.br{bottom:10px;right:10px;}

  .board-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--ink-dim);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .board-label .live{ display:inline-flex; align-items:center; gap:6px; color:var(--accent); }
  .live .dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px 1px var(--accent); }
  .live.paused{color:var(--ink-dim);}
  .live.paused .dot{background:var(--ink-dim);box-shadow:none;}
  .live.speaking .dot{ animation:pulse 1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .board-rows{}
  .row{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:var(--flap-w);
    gap:3px;
    transition:opacity .2s ease;
  }
  .row + .row{margin-top:6px;}
  .row.primary{--flap-w:19px;--flap-h:42px;--flap-fs:21px;}
  .row.secondary{--flap-w:12px;--flap-h:25px;--flap-fs:13px;}
  .board-rows.kinetic-hide-normal .row.primary,
  .board-rows.kinetic-hide-normal .row.secondary{ display:none; }

  .flap{
    position:relative;
    height:var(--flap-h);
    background:var(--flap);
    border-radius:3px;
    overflow:hidden;
    perspective:220px;
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 -1px 0 rgba(0,0,0,.6) inset;
  }
  .flap::after{
    content:"";
    position:absolute;
    left:0;right:0;top:calc(50% - .5px);
    height:1px;
    background:var(--flap-seam);
    z-index:5;
  }
  .flap .face{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Space Mono','Noto Sans KR',monospace;
    font-weight:700;
    font-size:var(--flap-fs);
    color:var(--ink);
    backface-visibility:hidden;
    background:var(--flap);
  }
  .row.secondary .face{color:var(--sub-ink);font-weight:500;}
  .row.kinetic .face{ color:var(--accent); text-shadow:0 0 18px rgba(255,138,61,.55); }
  .flap .face.back{transform:rotateX(180deg);}
  .flap .card{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    transition:transform .32s cubic-bezier(.4,0,.2,1);
  }
  .flap .card.flip{transform:rotateX(-180deg);}
  .flap .card.no-anim{transition:none;}

  .kinetic-stage{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding-block:16px 10px;
    animation:kineticIn .3s cubic-bezier(.2,.8,.2,1);
  }
  .kinetic-stage.active{ display:flex; }
  @keyframes kineticIn{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  .kinetic-tag{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:.18em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .row.kinetic{ --flap-w:40px;--flap-h:78px;--flap-fs:44px; }
  .row.kinetic .flap{ box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 -1px 0 rgba(0,0,0,.6) inset, 0 0 26px -6px var(--accent); }
  .kinetic-caption{
    font-family:'Noto Sans KR',sans-serif;
    font-size:14px;
    font-weight:500;
    color:var(--sub-ink);
    text-align:center;
  }

  .start-gate{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    background:rgba(8,9,11,.86);
    border-radius:14px;
    transition:opacity .3s ease;
  }
  .start-gate.hidden{ opacity:0; pointer-events:none; }
  .start-gate button{
    font-family:'Space Mono',monospace;
    font-size:15px;
    font-weight:700;
    letter-spacing:.04em;
    color:#0b0d10;
    background:linear-gradient(180deg,#ffb066,var(--accent));
    border:none;
    border-radius:10px;
    padding:14px 26px;
    cursor:pointer;
    box-shadow:0 10px 24px -10px rgba(255,138,61,.6);
  }
  .start-gate button:active{ transform:translateY(1px); }
  .start-gate p{ font-size:12px; color:var(--ink-dim); max-width:320px; text-align:center; line-height:1.6; margin:0; }

  .transport{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .transport button{
    font-family:'Space Mono',monospace;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--btn-ink);
    background:linear-gradient(180deg,#22262d,var(--btn));
    border:1px solid #2c313a;
    border-radius:8px;
    padding:9px 14px;
    cursor:pointer;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 2px 3px rgba(0,0,0,.4);
  }
  .transport button:hover{border-color:var(--accent-dim);}
  .transport button:active{transform:translateY(1px);}
  .transport button.play{color:var(--accent);border-color:var(--accent-dim);}
  .transport button.tts-off{color:var(--ink-dim);}
  .transport button:disabled{opacity:.4;cursor:not-allowed;}
  .transport .scrub{ flex:1; min-width:120px; display:flex; flex-direction:column; gap:6px; }
  .transport .track{ height:4px; border-radius:2px; background:var(--track); overflow:hidden; }
  .transport .track > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent-dim),var(--accent)); }
  .transport .meta{ display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-dim); }
  .transport .meta .tag{ color:var(--accent); text-transform:uppercase; letter-spacing:.08em; }

  .legend{ font-size:12px; color:var(--ink-dim); text-align:center; line-height:1.6; }
  .legend b{color:var(--sub-ink);}

  @media (prefers-reduced-motion: reduce){ .flap .card{transition:none;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="id">ENGLISH MCP · GATE 01</div>
      <h1>자동사 &amp; 3인칭 단수의 비밀</h1>
    </div>
    <div class="clock">EST. RUNTIME<br><b id="etaClock">00:00</b></div>
  </div>

  <div class="board-scale-wrap" id="boardWrap">
    <div class="board" id="board">
      <span class="rivet tl"></span><span class="rivet tr"></span>
      <span class="rivet bl"></span><span class="rivet br"></span>
      <div class="board-label">
        <span>DEPARTURE · LESSON 01</span>
        <span class="live" id="liveTag"><span class="dot"></span>PAUSED</span>
      </div>
      <div class="board-rows" id="boardRows">
        <div class="row primary" id="row1"></div>
        <div class="row secondary" id="row2"></div>
        <div class="kinetic-stage" id="kineticStage">
          <div class="kinetic-tag" id="kineticTag">PRACTICE</div>
          <div class="row kinetic" id="kineticRow"></div>
          <div class="kinetic-caption" id="kineticCaption"></div>
        </div>
      </div>
      <div class="start-gate" id="startGate">
        <button id="startBtn">▶ 시작 (음성 포함)</button>
        <p>탭하면 TTS 음성 안내와 함께 재생됩니다 · 음성 미지원 브라우저에서는 지정된 타임코드로만 진행됩니다</p>
      </div>
    </div>
  </div>

  <div class="transport">
    <button id="prevBtn" title="이전 카드">◀ PREV</button>
    <button id="playBtn" class="play" title="재생/일시정지">▶ 시작</button>
    <button id="nextBtn" title="다음 카드">NEXT ▶</button>
    <button id="ttsBtn" title="음성 안내 켜기/끄기">🔊 TTS</button>
    <div class="scrub">
      <div class="track"><i id="progressBar"></i></div>
      <div class="meta">
        <span class="tag" id="slideTag">TITLE</span>
        <span id="counter">1 / 1</span>
      </div>
    </div>
  </div>

  <p class="legend"><b>오디오 이벤트 기반 재생</b>입니다 · 각 카드는 TTS 음성이 끝나는 시점에 다음 카드로 전환됩니다 · 예문 카드는 한글 2초 → 영문 3초 순서로 고정 진행됩니다 · PREV/NEXT로 직접 넘겨보세요</p>
</div>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">

<script>
(function(){
  "use strict";

  // =====================================================================
  // 1. 강의 스크립트 → 타임라인(TIMELINE) 데이터
  //    type: 'dual'    — 헤더/규칙/퀴즈 등, 두 줄을 함께 보여주고 TTS가
  //                       끝나는 시점(오디오 이벤트)에 다음 카드로 전환
  //    type: 'example' — 영어 예문 카드. 한글 뜻 2초 → 영문 3초의 고정
  //                       2단계 시퀀스(요청사항 2번)로 진행
  //    type: 'kinetic' — 글자 수가 적은 강조 단어(동사)를 화면 중앙에
  //                       크게 확대해 플랩하는 키네틱 타이포그래피
  // =====================================================================
  var V = [
    ["Rise","오르다","Stock prices","Stock prices rise.","주가가 오른다","Stock prices don't rise.","주가가 안 오른다","Do stock prices rise?","주가가 오르나요?"],
    ["Fall","떨어지다","The interest rate","The interest rate falls.","금리가 떨어진다","The interest rate doesn't fall.","금리가 안 떨어진다","Does the interest rate fall?","금리가 떨어지나요?"],
    ["Surge","급등하다","Bitcoin","Bitcoin surges.","비트코인이 급등한다","Bitcoin doesn't surge.","비트코인이 급등하지 않는다","Does Bitcoin surge?","비트코인이 급등하나요?"],
    ["Plunge","폭락하다","The market","The market plunges.","시장이 폭락한다","The market doesn't plunge.","시장이 폭락하지 않는다","Does the market plunge?","시장이 폭락하나요?"],
    ["Fluctuate","요동치다","Exchange rates","Exchange rates fluctuate.","환율이 요동친다","Exchange rates don't fluctuate.","환율이 요동치지 않는다","Do exchange rates fluctuate?","환율이 요동치나요?"],
    ["Recover","회복되다","The economy","The economy recovers.","경제가 회복된다","The economy doesn't recover.","경제가 회복되지 않는다","Does the economy recover?","경제가 회복되나요?"],
    ["Slow down","둔화되다","Inflation","Inflation slows down.","인플레이션이 둔화된다","Inflation doesn't slow down.","인플레이션이 둔화되지 않는다","Does inflation slow down?","인플레이션이 둔화되나요?"],
    ["Collapse","붕괴하다","The housing market","The housing market collapses.","부동산 시장이 붕괴한다","The housing market doesn't collapse.","부동산 시장이 붕괴하지 않는다","Does the housing market collapse?","부동산 시장이 붕괴하나요?"],
    ["Grow","성장하다","Revenue","Revenue grows.","매출이 성장한다","Revenue doesn't grow.","매출이 성장하지 않는다","Does revenue grow?","매출이 성장하나요?"],
    ["Default","부도나다","The firm","The firm defaults.","그 회사가 부도난다","The firm doesn't default.","그 회사가 부도나지 않는다","Does the firm default?","그 회사가 부도나나요?"]
  ];

  var TIMELINE = [];
  function dual(row1,row2,tag,fallbackSec){
    TIMELINE.push({type:"dual", row1:row1, row2:row2||"", tag:tag||"", fallbackSec:fallbackSec});
  }
  function example(en,kr,tag){
    TIMELINE.push({type:"example", en:en, kr:kr, tag:tag||"EX"});
  }
  function kinetic(word,caption,tag){
    TIMELINE.push({type:"kinetic", word:word.toUpperCase(), caption:caption, tag:tag});
  }

  dual("[영어MCP] 제1강","자동사 & 3인칭 단수의 비밀","TITLE",4.5);
  dual("1. 자동사","딱 두 단어로 완성되는 문장","SEC.1",3.2);
  example("Stock prices rise.","주식이 오른다.","EX 1/5");
  example("Wind blows.","바람이 분다.","EX 2/5");
  example("Petals flutter.","꽃잎이 흩날린다.","EX 3/5");
  example("The luck comes.","복이 들어온다.","EX 4/5");
  example("Exchange rate fluctuates.","환율이 요동치네…","EX 5/5");
  dual("주어 + 동사","자동사 = 스스로 동작을 완성하는 동사","KEY",4);
  dual("2. 3인칭 단수 현재","영어의 유일한 귀찮은 규칙","SEC.2",3.2);
  dual("3인칭 단수 + 현재","동사 + -s, 부정은 doesn't","RULE",4);
  dual("나, 너 빼고 전부","= 3인칭","RULE",3.4);
  dual("3. 현재 시제의 진짜 의미","단순한 지금이 아니라 '늘 그러함'","SEC.3",3.6);
  example("I love you.","현재 — 늘 사랑해 (진심)","TENSE");
  example("I loved you.","과거 — 지금은 아니야","TENSE");
  example("I will love you.","미래 — 아직은 아니야","TENSE");
  dual("3인칭 단수 + 현재","동사 뒤에 -s","RECAP",3.4);
  dual("4. 돌발 퀴즈","인칭 구분 완벽 정리","SEC.4",3.2);
  dual("나의 친구 = ? 인칭","Q1","QUIZ",3.6);
  dual("정답: 3인칭","'나'가 아니라 '친구'니까","QUIZ",3.8);
  dual("너의 꿈 = ? 인칭","Q2","QUIZ",3.6);
  dual("정답: 3인칭","'너'가 아니라 '꿈'이니까","QUIZ",3.8);
  example("I run.","나 — 1인칭","PRONOUN");
  example("You run.","너 — 2인칭","PRONOUN");
  example("He runs.","그 — 3인칭 단수","PRONOUN");
  example("My friend runs.","내 친구 — 3인칭 단수","PRONOUN");
  dual("5. 부정문 만드는 법","-s의 변신","SEC.5",3.2);
  example("I don't run.","나는 안 뛴다","NEG");
  example("He doesn't run.","그는 안 뛴다","NEG");
  dual("6. 실전 연습","자동사 10선","SEC.6",3.2);

  V.forEach(function(v,i){
    var n = String(i+1).padStart(2,"0");
    kinetic(v[0], v[1]+" — "+v[2], "PRACTICE "+n+"/10");
    example(v[3], v[4], "긍정문");
    example(v[5], v[6], "부정문");
    example(v[7], v[8], "의문문");
  });

  dual("THE END","1형식 자동사 + 3인칭 단수 완전정복!","FIN",5);

  function calcFallback(row1,row2){
    var len = row1.length + row2.length;
    return Math.min(6.5, Math.max(2.6, 1.3 + len * 0.052));
  }
  TIMELINE.forEach(function(f){
    if(f.type==="dual" && !f.fallbackSec) f.fallbackSec = calcFallback(f.row1,f.row2);
    if(f.type==="kinetic") f.fallbackSec = 1.8;
    if(f.type==="example") f.fallbackSec = 5; // 2s(KR) + 3s(EN), fixed per spec
  });
  var TOTAL_MS = TIMELINE.reduce(function(a,f){ return a + f.fallbackSec*1000; }, 0);

  // =====================================================================
  // 2. 플랩보드 렌더링 (기존 구현 재사용)
  // =====================================================================
  var ROW1_LEN = Math.min(38, Math.max.apply(null, TIMELINE.map(function(f){
    return f.type==="dual" ? f.row1.length : (f.type==="example" ? Math.max(f.en.length,f.kr.length) : 0);
  })));
  var ROW2_LEN = Math.min(46, Math.max.apply(null, TIMELINE.map(function(f){
    return f.type==="dual" ? f.row2.length : (f.type==="example" ? f.kr.length : 0);
  })));
  var KINETIC_LEN = Math.min(11, Math.max.apply(null, TIMELINE.map(function(f){
    return f.type==="kinetic" ? f.word.length : 0;
  })));
  var SPIN_POOL = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,'-?";

  function pad(str,len){
    str = (str||"").slice(0,len);
    var total = len - str.length;
    var left = Math.floor(total/2), right = total-left;
    return " ".repeat(left)+str+" ".repeat(right);
  }
  function randChar(){ return SPIN_POOL[Math.floor(Math.random()*SPIN_POOL.length)]; }

  function buildRow(el,len){
    el.innerHTML = "";
    var flaps = [];
    for(var i=0;i<len;i++){
      var flap = document.createElement("div");
      flap.className = "flap";
      flap.innerHTML = '<div class="card"><div class="face front">&nbsp;</div><div class="face back">&nbsp;</div></div>';
      el.appendChild(flap);
      flaps.push({
        el:flap, card:flap.querySelector(".card"),
        front:flap.querySelector(".front"), back:flap.querySelector(".back"),
        current:" ", target:" ", gen:0
      });
    }
    return flaps;
  }

  var row1El = document.getElementById("row1");
  var row2El = document.getElementById("row2");
  var kineticRowEl = document.getElementById("kineticRow");
  var flaps1 = buildRow(row1El, ROW1_LEN);
  var flaps2 = buildRow(row2El, ROW2_LEN);
  var flapsK = buildRow(kineticRowEl, KINETIC_LEN);

  var boardEl = document.getElementById("board");
  // Pin the board's width to what it measures now, with the normal (widest)
  // rows in flow. Kinetic frames hide those rows to free up height, but the
  // panel must not narrow as a result — min-width keeps it stable.
  boardEl.style.minWidth = boardEl.offsetWidth + "px";
  var boardWrapEl = document.getElementById("boardWrap");
  function fitBoard(){
    boardEl.style.transform = "none";
    var naturalW = boardEl.offsetWidth;
    var naturalH = boardEl.offsetHeight;
    var avail = boardWrapEl.clientWidth;
    var scale = Math.min(1, avail / naturalW);
    boardEl.style.transform = scale < 1 ? "scale(" + scale.toFixed(4) + ")" : "none";
    boardWrapEl.style.height = Math.ceil(naturalH * scale) + "px";
  }
  var fitPending = false;
  function scheduleFit(){
    if(fitPending) return;
    fitPending = true;
    requestAnimationFrame(function(){ fitPending = false; fitBoard(); });
  }
  scheduleFit();
  window.addEventListener("resize", scheduleFit);
  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(scheduleFit); }

  function setFlapImmediate(f,ch){
    f.current = ch; f.front.textContent = ch; f.back.textContent = ch;
    f.card.classList.remove("flip");
  }

  function flipFlap(f,target,delay,spins){
    var myGen = ++f.gen;
    var seq = [];
    for(var i=0;i<spins;i++) seq.push(randChar());
    seq.push(target);
    var step = 0;
    function next(){
      if(f.gen !== myGen) return;
      if(f.current === seq[step] && step < seq.length-1){ step++; }
      var ch = seq[step];
      if(ch === f.current){
        if(step < seq.length-1){ step++; next(); }
        return;
      }
      f.back.textContent = ch;
      f.card.classList.add("no-anim");
      void f.card.offsetWidth;
      f.card.classList.remove("no-anim");
      requestAnimationFrame(function(){ if(f.gen === myGen) f.card.classList.add("flip"); });
      setTimeout(function(){
        if(f.gen !== myGen) return;
        f.card.classList.add("no-anim");
        f.card.classList.remove("flip");
        f.front.textContent = ch;
        f.current = ch;
        void f.card.offsetWidth;
        f.card.classList.remove("no-anim");
        step++;
        if(step < seq.length) setTimeout(next, 170);
      }, 320);
    }
    setTimeout(next, delay);
  }

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function renderRow(flaps,text,len){
    var padded = pad(text,len);
    for(var i=0;i<flaps.length;i++){
      var target = padded[i] || " ";
      var f = flaps[i];
      if(target === f.target) continue;
      f.target = target;
      if(reduceMotion){ f.gen++; setFlapImmediate(f,target); }
      else flipFlap(f,target, i*14, 1+Math.floor(Math.random()*2));
    }
  }

  // =====================================================================
  // 3. 화면 전환 헬퍼 (dual / example 2단계 / kinetic 확대)
  // =====================================================================
  var boardRowsEl = document.getElementById("boardRows");
  var kineticStageEl = document.getElementById("kineticStage");
  var kineticTagEl = document.getElementById("kineticTag");
  var kineticCaptionEl = document.getElementById("kineticCaption");

  function showDualVisual(f){
    var wasKinetic = boardRowsEl.classList.contains("kinetic-hide-normal");
    boardRowsEl.classList.remove("kinetic-hide-normal");
    kineticStageEl.classList.remove("active");
    renderRow(flaps1, f.row1, ROW1_LEN);
    renderRow(flaps2, f.row2, ROW2_LEN);
    if(wasKinetic) scheduleFit();
  }
  function showExampleStage(stage,f){
    var wasKinetic = boardRowsEl.classList.contains("kinetic-hide-normal");
    boardRowsEl.classList.remove("kinetic-hide-normal");
    kineticStageEl.classList.remove("active");
    if(stage==="kr"){
      renderRow(flaps1, f.kr, ROW1_LEN);
      renderRow(flaps2, "", ROW2_LEN);
    } else {
      renderRow(flaps1, f.en, ROW1_LEN);
      renderRow(flaps2, f.kr, ROW2_LEN);
    }
    if(wasKinetic) scheduleFit();
  }
  function showKineticVisual(f){
    kineticTagEl.textContent = f.tag || "";
    kineticCaptionEl.textContent = f.caption || "";
    renderRow(flapsK, f.word, KINETIC_LEN);
    boardRowsEl.classList.add("kinetic-hide-normal");
    kineticStageEl.classList.add("active");
    scheduleFit();
  }

  // =====================================================================
  // 4. TTS 음성 엔진 — 오디오 이벤트(onend) 기반 타임라인 진행.
  //    미지원/차단 시 위에서 계산한 fallbackSec 타임코드로 자동 대체.
  // =====================================================================
  var ttsSupported = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
  var ttsEnabled = ttsSupported;
  var HANGUL_RE = /[가-힣]/;
  function detectLang(text){ return HANGUL_RE.test(text) ? "ko-KR" : "en-US"; }

  function cancelSpeech(){
    if(ttsSupported){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  }

  // text 하나를 말하고 끝나면 cb() 호출. myRun이 낡은 세대면 무시(경합 방지).
  function speakOne(text, lang, cb, myRun){
    if(!ttsEnabled || !ttsSupported || !text){ cb(); return; }
    var done = false;
    function finish(){
      if(done) return;
      done = true;
      if(myRun === runGen) cb();
    }
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = 0.98; u.pitch = 1;
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
      setTimeout(finish, Math.max(1400, text.length*170)); // 안전장치: onend 미발생 대비
    }catch(e){ finish(); }
  }

  // items(텍스트 배열)를 순서대로 말하고 모두 끝나면 doneCb() 호출
  function speakSequence(items, doneCb, myRun){
    var list = items.filter(function(it){ return it.text; });
    var i = 0;
    function step(){
      if(myRun !== runGen) return;
      if(i >= list.length){ doneCb(); return; }
      var it = list[i++];
      speakOne(it.text, it.lang, step, myRun);
    }
    step();
  }

  // =====================================================================
  // 5. 재생 타임라인 엔진
  // =====================================================================
  var idx = 0, playing = false, started = false, runGen = 0;
  var frameEstMs = TIMELINE[0].fallbackSec*1000, frameStart = 0;

  var etaEl = document.getElementById("etaClock");
  var liveTag = document.getElementById("liveTag");
  var progressBar = document.getElementById("progressBar");
  var counterEl = document.getElementById("counter");
  var slideTagEl = document.getElementById("slideTag");
  var playBtn = document.getElementById("playBtn");
  var ttsBtn = document.getElementById("ttsBtn");
  var startGate = document.getElementById("startGate");

  function fmtClock(ms){
    var total = Math.round(ms/1000);
    return String(Math.floor(total/60)).padStart(2,"0")+":"+String(total%60).padStart(2,"0");
  }

  function setLiveState(state){ // 'on' | 'paused' | 'speaking'
    liveTag.classList.toggle("paused", state==="paused");
    liveTag.classList.toggle("speaking", state==="speaking");
    liveTag.innerHTML = '<span class="dot"></span>' + (state==="paused" ? "PAUSED" : state==="speaking" ? "NARRATING" : "ON AIR");
  }

  function updateChrome(f){
    slideTagEl.textContent = f.tag || "—";
    counterEl.textContent = (idx+1)+" / "+TIMELINE.length;
    var before = TIMELINE.slice(0,idx).reduce(function(a,x){return a+x.fallbackSec*1000;},0);
    etaEl.textContent = fmtClock(before) + " / " + fmtClock(TOTAL_MS);
  }

  function goTo(i){
    runGen++;
    var myRun = runGen;
    cancelSpeech();
    idx = ((i % TIMELINE.length) + TIMELINE.length) % TIMELINE.length;
    var f = TIMELINE[idx];
    updateChrome(f);
    frameEstMs = f.fallbackSec*1000;
    frameStart = performance.now();

    function doAdvance(){
      if(myRun !== runGen) return;
      setLiveState(playing ? "on" : "paused");
      if(!playing) return;
      goTo(idx+1);
    }

    if(f.type==="dual"){
      showDualVisual(f);
      if(ttsEnabled && ttsSupported){
        setLiveState("speaking");
        setTimeout(doAdvance, f.fallbackSec*1000 + 4000); // 안전 상한
        speakSequence([
          {text:f.row1, lang:detectLang(f.row1)},
          {text:f.row2, lang:detectLang(f.row2)}
        ], function(){ setTimeout(doAdvance, 250); }, myRun);
      } else {
        setTimeout(doAdvance, f.fallbackSec*1000);
      }
    } else if(f.type==="kinetic"){
      showKineticVisual(f);
      var minMs = Math.max(1200, f.fallbackSec*1000*0.66);
      if(ttsEnabled && ttsSupported){
        setLiveState("speaking");
        var minDone=false, speechDone=false;
        setTimeout(function(){ minDone=true; if(speechDone) doAdvance(); }, minMs);
        setTimeout(doAdvance, f.fallbackSec*1000 + 2500); // 안전 상한
        speakOne(f.word, "en-US", function(){ speechDone=true; if(minDone) doAdvance(); }, myRun);
      } else {
        setTimeout(doAdvance, f.fallbackSec*1000);
      }
    } else if(f.type==="example"){
      // 요청사항 2번: 한글 2초 → 영문 3초, 고정 타임코드(TTS는 병행 재생)
      showExampleStage("kr", f);
      if(ttsEnabled && ttsSupported){ setLiveState("speaking"); speakOne(f.kr, "ko-KR", function(){}, myRun); }
      setTimeout(function(){
        if(myRun !== runGen) return;
        showExampleStage("en", f);
        if(ttsEnabled && ttsSupported) speakOne(f.en, "en-US", function(){}, myRun);
        setTimeout(doAdvance, 3000);
      }, 2000);
    }
  }

  function tick(){
    if(started){
      var pct = Math.min(100, ((performance.now()-frameStart)/frameEstMs)*100);
      progressBar.style.width = pct+"%";
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function setPlaying(p){
    playing = p;
    if(p){
      started = true;
      startGate.classList.add("hidden");
      goTo(idx);
    } else {
      runGen++; // 진행 중이던 오디오/타이머 세대를 무효화
      cancelSpeech();
      setLiveState("paused");
    }
    playBtn.textContent = playing ? "❚❚ PAUSE" : (started ? "▶ PLAY" : "▶ 시작");
  }

  document.getElementById("startBtn").addEventListener("click", function(){ setPlaying(true); });
  playBtn.addEventListener("click", function(){ setPlaying(!playing); });
  document.getElementById("nextBtn").addEventListener("click", function(){
    startGate.classList.add("hidden"); started = true;
    goTo(idx+1);
  });
  document.getElementById("prevBtn").addEventListener("click", function(){
    startGate.classList.add("hidden"); started = true;
    goTo(idx-1);
  });
  ttsBtn.addEventListener("click", function(){
    ttsEnabled = !ttsEnabled;
    cancelSpeech();
    ttsBtn.textContent = ttsEnabled ? "🔊 TTS" : "🔇 TTS";
    ttsBtn.classList.toggle("tts-off", !ttsEnabled);
  });
  if(!ttsSupported){
    ttsBtn.disabled = true;
    ttsBtn.textContent = "🔇 TTS 미지원";
    ttsBtn.title = "이 브라우저는 음성 합성을 지원하지 않습니다 — 타임코드로 진행됩니다";
  }

  // 초기 상태: 첫 카드를 정적으로 미리 보여주고, 오디오는 사용자 탭 후 시작
  showDualVisual(TIMELINE[0]);
  updateChrome(TIMELINE[0]);
})();
</script>
</body>
</html>
