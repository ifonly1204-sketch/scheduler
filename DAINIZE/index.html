<div class="iphone-frame">
    <div class="header">
        <div class="logo">걷다</div>
        <div class="notif-icon">🔔</div>
    </div>

    <div id="app-viewport">
        <section class="calendar-section">
            <div class="calendar">
                <div class="calendar-header">
                    <span class="month-picker" id="month-picker">February</span>
                    <div class="year-picker">
                        <span id="pre-year" class="year-change"><</span>
                        <span id="year">2026</span>
                        <span id="next-year" class="year-change">></span>
                    </div>
                </div>
                <div class="calendar-body">
                    <div class="calendar-week-days">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div class="calendar-days"></div>
                </div>
                <div class="calendar-footer">
                    <div class="day-text-formate">TODAY</div>
                    <div class="time-formate" id="current-time">00:00:00</div>
                    <div class="date-formate" id="current-date">01 - Feb - 2026</div>
                </div>
            </div>
        </section>

        <div class="sticky-agenda-header">
            <div class="agenda-title-wrapper">
                <span>Today's Agenda</span>
                <div class="agenda-line"></div>
            </div>
        </div>

        <section class="todo-section">
            <div class="todo-app">
                <div class="row">
                    <input type="text" id="input-box" placeholder="Add your Task">
                    <button onclick="addTask()">Add</button>
                </div>
                <ul id="list-container">
                    </ul>
            </div>
        </section>
    </div>
</div>
