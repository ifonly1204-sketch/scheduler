<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gotta - Ultimate Edition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --color-1: #FFD580;
            /* 연오렌지 */
            --color-2: #F08080;
            /* 코랄 */
            --color-3: #FFB6C1;
            /* 라이트핑크 */
            --tile-bg: rgba(255, 255, 255, 0.7);
            --tile-active: #8BC34A;
            /* 클릭 시 변할 색상 */
            --shadow: 0 10px 25px rgba(133, 125, 125, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: #fff;
            ;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* iPhone Frame */
        .iphone-frame {
            position: relative;
            width: 375px;
            height: 812px;
            background: transparent;
            border: 12px solid #333;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 30px;
            background: #333;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 18px;
            z-index: 100;
        }

        .bg-image-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            display: block;
            background-size: cover;
            pointer-events: none;
            animation: parallaxBackground linear;
            animation-timeline: scroll(self);
        }

        .bg-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 1;
        }

        @keyframes parallaxBackground {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10%);
            }
        }

        .tile-card {
            animation: appear linear;
            animation-timeline: view();
            animation-range: entry 0% cover 30%;
            z-index: 1;
        }

        .main-content {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 20px;
            background: transparent !important;
            height: 100%;
            width: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            -ms-overflow-style: none;
            scrollbar-width: none;
            position: relative;
            z-index: 1;
        }

        .status-bar {
            height: 44px;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #444;
        }

        header {
            padding: 35px 24px;
            display: flex;
            align-items: center;
            color: #333;
        }

        header h1 {
            font-size: 16px;
            font-weight: 500;
            margin-left: 15px;
        }

        .clock-widget {
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        .clock-face {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #fff;
            position: relative;
            border: 5px solid #2f69b6;
            box-shadow:
                var(--shadow),
                0 10px 10px rgba(76, 18, 18, 0.05),
                inset 0 3px 5px rgba(35, 21, 21, 0.5);
        }

        /* --- 비정형 그리드 & 플립 타일 --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            perspective: 1000px;
        }

        .tile-card {
            height: 155px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            animation: appear linear;
            animation-timeline: view();
            animation-range: entry 0% cover 30%;
            z-index: 1;
        }

        .tile-card.flipped {
            transform: rotateY(180deg) translateY(calc(var(--y-offset, 0px)));
        }


        .tile-front,
        .tile-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 25px;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        .tile-front {
            background: var(--tile-bg);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        .tile-card.active .tile-front {
            background: var(--tile-active);
            color: #fff;
        }

        .tile-card.active .tile-icon {
            color: #fff;
        }

        .tile-icon {
            font-size: 28px;
            color: #444;
            margin-bottom: 10px;
        }

        .tile-title {
            font-size: 15px;
            font-weight: 600;
        }

        /* Back: 메모 목록 */
        .tile-back {
            background: #fff;
            transform: rotateY(180deg);
            padding: 18px;
        }

        .memo-header {
            font-size: 13px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .memo-list {
            list-style: none;
            font-size: 12px;
            color: #666;
            overflow-y: auto;
        }

        .memo-item {
            padding: 6px 0;
            border-bottom: 1px dotted #f0f0f0;
            cursor: pointer;
        }

        .bottom-bar {
            height: 50px;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #999;
            z-index: 20;
            border-top: 1px solid #eee;
        }

        /* Editor Modal */
        #memo-editor {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .editor-content {
            width: 80%;
            background: #fff;
            border-radius: 20px;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .save {
            background: var(--tile-active);
            color: #fff;
        }

        /* 사이드 메뉴 기본 스타일 */
        .side-menu {
            position: absolute;
            top: 0;
            left: -100%;
            /* 처음에 숨김 */
            width: 80%;
            height: 100%;
            background: rgba(255, 255, 255, 0.4);
            /* 투명도 조절 */
            backdrop-filter: blur(20px);
            /* 글라스모피즘 핵심 */
            z-index: 300;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.1);
            border-right: 1px solid rgba(255, 255, 255, 0.3);
        }

        .side-menu.open {
            left: 0;
        }

        /* 메뉴 내부 요소 */
        .menu-header {
            padding: 50px 24px 20px;
            text-align: right;
        }

        .close-btn {
            font-size: 24px;
            color: #444;
            cursor: pointer;
        }

        .user-profile {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .profile-icon {
            font-size: 50px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .menu-list {
            list-style: none;
            padding: 20px;
        }

        .menu-list li {
            padding: 15px 10px;
            font-size: 16px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        /* 인증 모달 (로그인/회원가입) */
        .auth-modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 400;
            justify-content: center;
            align-items: center;
        }

        .auth-content {
            width: 85%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <div class="iphone-frame">

        <div class="notch"></div>

        <div class="bg-image-container"
            style="position: absolute; top: 0; left: 0; width: 120%; height: 140%; overflow: hidden; z-index: -1; pointer-events: none;">
            <img src="illust-images/paper-illustration.png" alt="background"
                style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div id="side-menu" class="side-menu">
            <div class="menu-header">
                <i class="fas fa-times close-btn" onclick="toggleMenu()"></i>
            </div>
            <div class="menu-content">
                <div class="user-profile">
                    <div class="profile-icon"><i class="fas fa-user-circle"></i></div>
                    <p>로그인이 필요합니다</p>
                </div>
                <ul class="menu-list">
                    <li onclick="socialLogin('kakao')" class="social-btn kakao">
                        <i class="fas fa-comment"></i> 카카오로 시작하기
                    </li>
                    <li onclick="socialLogin('google')" class="social-btn google">
                        <i class="fab fa-google"></i> 구글로 시작하기
                    </li>
                    <hr>
                    <li onclick="viewPolicy()"><i class="fas fa-file-alt"></i> 개인정보 처리방침</li>
                </ul>
            </div>
        </div>

        <div id="auth-modal" class="auth-modal">
            <div class="auth-content">
                <h2 id="auth-title">로그인</h2>
                <div id="auth-form-container">
                </div>
                <div class="auth-footer">
                    <button class="btn" onclick="closeAuth()">닫기</button>
                </div>
            </div>
        </div>


        <div class="main-content">
            <div class="status-bar"><span></span></div>
            <header><i class="fas fa-bars" style="cursor: pointer;"></i>
                <h1>Daynize Key Club</h1>
            </header>

            <div class="clock-widget">
                <div class="clock-face">
                    <div class="hour-hand"
                        style="position:absolute; top:50%; left:50%; width:4px; height:35px; background:#333; transform-origin:bottom; transform:translate(-50%, -100%) rotate(0deg);">
                    </div>
                    <div class="minute-hand"
                        style="position:absolute; top:50%; left:50%; width:3px; height:50px; background:#333; transform-origin:bottom; transform:translate(-50%, -100%) rotate(0deg);">
                    </div>
                    <div
                        style="position:absolute; top:50%; left:50%; width:6px; height:6px; background:#333; border-radius:50%; transform:translate(-50%, -50%);">
                    </div>
                </div>
            </div>
            <div class="grid-container" id="tileGrid">
            </div>
        </div>

        <div class="bottom-bar">거둬내어 가벼운 삶 걷다</div>

        <div id="memo-editor">
            <div class="editor-content">
                <div style="font-weight:bold;">메모 수정</div>
                <textarea id="editInput"></textarea>
                <div class="btn-group">
                    <button class="btn" onclick="closeEditor()">취소</button>
                    <button class="btn save" onclick="saveMemo()">저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js" crossorigin="anonymous"></script>
    <script type="module">
        // ── 2. Firebase SDK Import (모듈 방식) ──────────────────────────
        import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getAuth, signInWithPopup,
            GoogleAuthProvider, OAuthProvider,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // ── 3. 초기 설정 데이터 (새로운 Firebase 정보로 업데이트됨) ────────
        const firebaseConfig = {
            apiKey: "AIzaSyCMORbrTYKqvRfEYxKGE7HBtZBodr5RES4",
            authDomain: "daynize-467f1.firebaseapp.com",
            projectId: "daynize-467f1",
            storageBucket: "daynize-467f1.firebasestorage.app",
            messagingSenderId: "821948533190",
            appId: "1:821948533190:web:dd1a2bd5f498ac90144ac7",
            measurementId: "G-4CT2M1C8YR"
        };
        const tileData = [
            { title: "오늘 일정", icon: "fa-clock", memos: ["9:00 데일리 스크럼", "14:00 디자인 리뷰"] },
            { title: "업무", icon: "fa-briefcase", memos: ["보고서 작성", "메일 확인"] },
            { title: "Tee Time", icon: "fa-golf-ball", memos: ["10/12 08:30 해운대CC"] },
            { title: "쇼핑", icon: "fa-shopping-cart", memos: ["우유 사기", "달걀 사기"] },
            { title: "건강", icon: "fa-heartbeat", memos: ["영양제 복용"] },
            { title: "재정", icon: "fa-wallet", memos: ["가계부 정리"] },
            { title: "독서", icon: "fa-book", memos: ["거둬내는 미학"] },
            { title: "아이디어", icon: "fa-lightbulb", memos: ["새로운 UI 구상"] }
        ];

        // ── 4. 서비스 초기화 ───────────────────────────────────────────
        const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
        const auth = getAuth(app);

        try {
            if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                Kakao.init('4daef3a7bb04244e2afb6ea3659ba667');
            }
        } catch (e) {
            console.warn('Kakao 초기화 실패:', e);
        }

        // ── 5. DOM 요소 캐싱 (성능 최적화) ────────────────────────────────
        const grid = document.getElementById('tileGrid');
        const profileText = document.querySelector('.user-profile p');
        const hourHand = document.querySelector('.hour-hand');
        const minuteHand = document.querySelector('.minute-hand');

        // ── 6. 주요 기능 함수 ───────────────────────────────────────────

        // 타일 렌더링
        const renderTiles = () => {
            if (!grid) return;
            grid.innerHTML = tileData.map(item => `
            <div class="tile-card">
                <div class="tile-front" onclick="handleTileClick(this.parentElement)">
                    <i class="fas ${item.icon} tile-icon"></i>
                    <span class="tile-title">${item.title}</span>
                </div>
                <div class="tile-back">
                    <div class="memo-header">
                        <span>${item.title}</span>
                        <i class="fas fa-times" onclick="flipBack(this.closest('.tile-card'))"></i>
                    </div>
                    <ul class="memo-list">
                        ${item.memos.map(m => `<li class="memo-item" onclick="openEditor(this)">${m}</li>`).join('')}
                    </ul>
                </div>
            </div>
        `).join('');
        };

        // 아날로그 시계 업데이트
        const updateClock = () => {
            const now = new Date();
            const hDeg = (now.getHours() % 12) * 30 + now.getMinutes() * 0.5;
            const mDeg = now.getMinutes() * 6;
            if (hourHand) hourHand.style.transform = `translate(-50%, -100%) rotate(${hDeg}deg)`;
            if (minuteHand) minuteHand.style.transform = `translate(-50%, -100%) rotate(${mDeg}deg)`;
        };

        // ── 7. 전역 함수 등록 (HTML onclick 연결용) ──────────────────────
        window.handleTileClick = (card) => { card.classList.add('flipped', 'active'); };
        window.flipBack = (card) => card.classList.remove('flipped');
        window.toggleMenu = () => document.getElementById('side-menu').classList.toggle('open');
        window.closeAuth = () => document.getElementById('auth-modal').style.display = 'none';
        window.openEditor = (li) => {
            document.getElementById('editInput').value = li.innerText;
            document.getElementById('memo-editor').style.display = 'flex';
            window.currentEditItem = li;
        };
        window.closeEditor = () => document.getElementById('memo-editor').style.display = 'none';
        window.saveMemo = () => {
            if (window.currentEditItem) window.currentEditItem.innerText = document.getElementById('editInput').value;
            window.closeEditor();
        };

        // 소셜 로그인 통합 함수
        window.socialLogin = async (type) => {
            try {
                let provider;
                if (type === 'google') {
                    provider = new GoogleAuthProvider();
                } else if (type === 'kakao') {
                    provider = new OAuthProvider('oidc.kakao');
                    provider.addScope('openid');
                }
                const result = await signInWithPopup(auth, provider);

                // ⚡ [추천 수정] OIDC 토큰 데이터 또는 프로필 목록에서 카카오 닉네임을 안전하게 추출합니다.
                const idTokenResult = await result.user.getIdTokenResult();
                const rawNickname = idTokenResult.claims.name || idTokenResult.claims.nickname || result.user.providerData?.[0]?.displayName;
                const userName = result.user.displayName || rawNickname || '사용자';

                alert(`${userName}님, 반갑습니다!`);
                window.toggleMenu();
            } catch (err) {
                console.error(`${type} 로그인 에러:`, err);
                if (err.code !== 'auth/popup-closed-by-user') alert(`로그인 실패: ${err.message}`);
            }
        };

        // — 8. 이벤트 및 상태 감지

        onAuthStateChanged(auth, async (user) => {
            if (profileText) {
                if (user) {
                    // ⚡ [추천 수정] 로그인 상태 감지 시에도 카카오 토큰에서 이름을 분석해 냅니다.
                    const idTokenResult = await user.getIdTokenResult();
                    const rawNickname = idTokenResult.claims.name || idTokenResult.claims.nickname || user.providerData?.[0]?.displayName;
                    const currentName = user.displayName || rawNickname || user.email || '사용자';

                    profileText.innerText = `${currentName}님, 반갑습니다!`;
                } else {
                    profileText.innerText = '로그인이 필요합니다';
                }
            }
        });
        // 실행
        renderTiles();
        updateClock();
        setInterval(updateClock, 1000);

        const bars = document.querySelector('header i.fa-bars');
        if (bars) bars.onclick = window.toggleMenu;

        // Firebase auth 전역 노출 (필요시)
        window.auth = auth;
    </script>
</body>

</html>
